name: Claude

# AI-assisted container generation. Claude responds when @claude is mentioned
# in an issue, a pull request, or a review comment — for example:
#
#   @claude add an L2 rung to the WP9 ladder that links OpenSSL, following
#   docs/ROADMAP.md and the demo conventions in CLAUDE.md
#
# REQUIRES a repository secret named ANTHROPIC_API_KEY. Without it this
# workflow is inert: it will start and fail at the action step rather than
# doing anything silently. Add it under Settings > Secrets and variables >
# Actions.
#
# Note that every run consumes API credit, and that Claude follows CLAUDE.md,
# which requires reproducers for findings and UNVERIFIED markers on commands
# that have not been executed.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

# Least privilege: Claude may read the repo and write to issues and pull
# requests. It cannot push to protected branches or change workflows.
permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude:
    # Only run when explicitly summoned, so a normal comment costs nothing.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Guard — require the API key
        run: |
          if [ -z "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            echo "ANTHROPIC_API_KEY is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Podman is preinstalled on the runner, so Claude can build and
          # verify a container rather than only writing a Containerfile.
          allowed_tools: "Bash,Read,Write,Edit,Glob,Grep"
