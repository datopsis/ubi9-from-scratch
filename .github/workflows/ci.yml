name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The dissection needs no container runtime and no Linux. It runs first
  # because every build below is checked against the figures it produces.
  analysis:
    name: Dissect the official image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Acquire the pinned subject
        run: python scripts/fetch_image.py

      - name: File inventory
        run: python scripts/inventory.py

      - name: Package set
        run: python scripts/rpmdb.py

      - name: Package attribution
        run: python scripts/attribute.py

      - name: Build transaction
        run: python scripts/transaction.py

      - name: Dependency closure of the shell
        run: python scripts/closure.py /usr/bin/bash --json work/closure-bash.json

      - name: Upload analysis
        uses: actions/upload-artifact@v4
        with:
          name: analysis
          path: |
            work/subject.json
            work/inventory.json
            work/attribution.json
            work/closure-bash.json
          retention-days: 14

  # Every example container builds, runs, is verified and is scanned here.
  # Adding a rung to the ladder means adding one entry to this matrix.
  build:
    name: ${{ matrix.variant }}
    needs: analysis
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # WP6 — the reconstruction of ubi9-micro itself.
          - variant: micro
            releasever: '9.8'
            containerfile: reconstruction/Containerfile
            context: reconstruction
            needs_official_layer: true
            smoke: /bin/sh -c "echo hello from the rebuild"
            compare_to_official: true

          # L0.0 — what an image actually is, taken apart by hand.
          - variant: l0.0-anatomy
            releasever: '9.8'
            containerfile: demos/l0.0-anatomy/Containerfile
            context: demos/l0.0-anatomy
            needs_official_layer: false
            smoke: ''
            expect_entries: 1

          # L0.1 — describe the environment.
          - variant: l0.1-describe
            releasever: '9.8'
            containerfile: demos/l0.1-describe/Containerfile
            context: demos/l0.1-describe
            needs_official_layer: false
            smoke: ''
            expect_entries: 1

          # L0.2 — do real work.
          - variant: l0.2-sha256
            releasever: '9.8'
            containerfile: demos/l0.2-sha256/Containerfile
            context: demos/l0.2-sha256
            needs_official_layer: false
            smoke: '--report'
            expect_entries: 1

          # L0.3 — why a container at all.
          - variant: l0.3-authority
            releasever: '9.8'
            containerfile: demos/l0.3-authority/Containerfile
            context: demos/l0.3-authority
            needs_official_layer: false
            # The smoke test runs unconfined on purpose: the probes are meant
            # to succeed here, and verify.sh then shows them failing when the
            # restrictions are applied.
            smoke: ''
            allow_nonzero_smoke: true
            expect_entries: 1

          # L1 — leaving scratch: dynamic linkage against a real base.
          - variant: l1-dynamic
            releasever: '9.8'
            containerfile: demos/l1-dynamic/Containerfile
            context: demos/l1-dynamic
            needs_official_layer: false
            smoke: '--report'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Show runtime versions
        run: |
          podman --version
          python --version

      - name: Acquire the official layer
        if: matrix.needs_official_layer
        run: python scripts/fetch_image.py

      - name: Extract the repo definition
        if: matrix.needs_official_layer
        run: python reconstruction/extract-repo-file.py

      - name: Build
        run: |
          podman build \
            --squash-all \
            --build-arg BUILDER=registry.access.redhat.com/ubi9/ubi:${{ matrix.releasever }} \
            --file ${{ matrix.containerfile }} \
            --tag ${{ matrix.variant }}:${{ matrix.releasever }} \
            ${{ matrix.context }}

      - name: Verify — single layer
        run: |
          layers=$(podman image inspect ${{ matrix.variant }}:${{ matrix.releasever }} --format '{{len .RootFS.Layers}}')
          echo "layers: $layers"
          test "$layers" = "1" || { echo "FAIL: expected 1 layer, got $layers"; exit 1; }

      - name: Smoke test
        run: |
          if [ "${{ matrix.allow_nonzero_smoke }}" = "true" ]; then
            # Exit status carries a measurement, not a pass/fail verdict.
            podman run --rm ${{ matrix.variant }}:${{ matrix.releasever }} ${{ matrix.smoke }} || true
          else
            podman run --rm ${{ matrix.variant }}:${{ matrix.releasever }} ${{ matrix.smoke }}
          fi

      # Functional verification. Each demo owns its verify.sh, so proving a
      # container does its job scales with the ladder instead of accumulating
      # per-variant steps here.
      - name: Functional test
        run: |
          script="${{ matrix.context }}/verify.sh"
          if [ -f "$script" ]; then
            chmod +x "$script"
            "$script" ${{ matrix.variant }}:${{ matrix.releasever }}
          else
            echo "no verify.sh in ${{ matrix.context }} — smoke test only"
          fi

      # Filesystem inspection rather than in-container commands, so this works
      # for images with no shell.
      - name: Export the filesystem
        run: |
          podman create --name check-${{ matrix.variant }} ${{ matrix.variant }}:${{ matrix.releasever }}
          podman export check-${{ matrix.variant }} -o rootfs.tar
          podman rm check-${{ matrix.variant }}

      - name: Verify — contents
        run: |
          python scripts/verify_image.py rootfs.tar \
            ${{ matrix.expect_entries && format('--expect-entries {0}', matrix.expect_entries) || '' }} \
            --json verify-${{ matrix.variant }}.json

      # WP7 — the actual comparison. Totals landing close is not evidence the
      # contents match, so this diffs the inventories path by path.
      - name: Compare against the official image
        if: matrix.compare_to_official
        run: |
          python scripts/inventory.py
          python scripts/compare.py rootfs.tar --json compare-${{ matrix.variant }}.json

      # Security evidence, produced by the same script a reader runs on their
      # own workstation, so the tutorial and the pipeline cannot drift apart.
      - name: Install syft and grype
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL https://get.anchore.io/syft  | sh -s -- -b "$HOME/.local/bin"
          curl -sSfL https://get.anchore.io/grype | sh -s -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: SBOM and vulnerability scan
        run: |
          chmod +x scripts/security_scan.sh
          scripts/security_scan.sh ${{ matrix.variant }}:${{ matrix.releasever }} security-results

      - name: Report size
        run: |
          size=$(podman image inspect ${{ matrix.variant }}:${{ matrix.releasever }} --format '{{.Size}}')
          {
            echo "## ${{ matrix.variant }}"
            echo ""
            echo "| Measure | Bytes |"
            echo "| --- | ---: |"
            echo "| This build (uncompressed) | $size |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ matrix.compare_to_official }}" = "true" ]; then
            official=23591424
            {
              echo "| Official ubi9-micro | $official |"
              echo "| Difference | $((size - official)) |"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "size=$size official=$official delta=$((size - official))"
          else
            official=23591424
            {
              echo "| Official ubi9-micro, for scale | $official |"
              echo "| Fraction of it | $(( size * 100 / official ))% |"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "size=$size ($(( size * 100 / official ))% of official ubi9-micro)"
          fi

      - name: Upload verification and security evidence
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ matrix.variant }}
          path: |
            verify-${{ matrix.variant }}.json
            compare-${{ matrix.variant }}.json
            security-results/
          if-no-files-found: warn
          retention-days: 14

  # Part 0 — the toolkit. Verifies the install commands the tutorials give and
  # exercises every tool, so tools/ quotes observed output rather than docs.
  toolkit:
    name: Toolkit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: What ships on the runner already
        run: |
          for t in podman skopeo buildah umoci syft grype jq; do
            if command -v "$t" >/dev/null 2>&1; then
              echo "$t: $("$t" --version 2>&1 | head -1)"
            else
              echo "$t: absent"
            fi
          done

      # Verifies the Ubuntu / WSL2 half of every tutorial's prerequisites.
      - name: Install — Ubuntu / WSL2 (apt)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq podman skopeo buildah jq
          echo "--- installed ---"
          podman --version
          skopeo --version
          buildah --version
          jq --version

      - name: Install — umoci (no distribution package)
        run: |
          UMOCI_VERSION=v0.4.7
          curl -sSfL -o /tmp/umoci "https://github.com/opencontainers/umoci/releases/download/${UMOCI_VERSION}/umoci.amd64"
          sudo install -m0755 /tmp/umoci /usr/local/bin/umoci
          umoci --version

      - name: Install — syft and grype
        run: |
          curl -sSfL https://get.anchore.io/syft  | sudo sh -s -- -b /usr/local/bin
          curl -sSfL https://get.anchore.io/grype | sudo sh -s -- -b /usr/local/bin
          syft version | head -2
          grype version | head -2

      # Verifies the Red Hat half by running it inside a UBI 9 container, so the
      # dnf commands the tutorials give are executed rather than assumed.
      - name: Install — Red Hat / Fedora (dnf), verified inside ubi9
        run: |
          podman run --rm registry.access.redhat.com/ubi9/ubi:9.8 bash -c 'set -e; dnf install -y --nodocs --setopt install_weak_deps=false skopeo buildah jq >/dev/null 2>&1; echo "--- installed inside ubi9 ---"; skopeo --version; buildah --version; jq --version'

      - name: Build an image for the tools to work on
        run: |
          podman build --squash-all --file demos/l0.2-sha256/Containerfile --tag l0.2-sha256:9.8 demos/l0.2-sha256

      - name: Exercise every tool
        run: |
          chmod +x scripts/toolkit_demo.sh
          scripts/toolkit_demo.sh l0.2-sha256:9.8 2>&1 | tee toolkit-output.txt

      - name: Upload the transcript
        uses: actions/upload-artifact@v4
        with:
          name: toolkit-transcript
          path: toolkit-output.txt
          retention-days: 14
