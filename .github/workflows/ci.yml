name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The dissection needs no container runtime and no Linux. It runs first
  # because every build below is checked against the figures it produces.
  analysis:
    name: Dissect the official image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Acquire the pinned subject
        run: python scripts/fetch_image.py

      - name: File inventory
        run: python scripts/inventory.py

      - name: Package set
        run: python scripts/rpmdb.py

      - name: Package attribution
        run: python scripts/attribute.py

      - name: Build transaction
        run: python scripts/transaction.py

      - name: Dependency closure of the shell
        run: python scripts/closure.py /usr/bin/bash --json work/closure-bash.json

      - name: Upload analysis
        uses: actions/upload-artifact@v4
        with:
          name: analysis
          path: |
            work/subject.json
            work/inventory.json
            work/attribution.json
            work/closure-bash.json
          retention-days: 14

  # Every example container builds here. Adding a rung to the WP9 ladder means
  # adding an entry to this matrix and nothing else.
  build:
    name: Build ${{ matrix.variant }} (RHEL ${{ matrix.releasever }})
    needs: analysis
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [micro]
        releasever: ['9.8']
        include:
          - variant: micro
            releasever: '9.8'
            containerfile: reconstruction/Containerfile
            context: reconstruction
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Show runtime versions
        run: |
          podman --version
          python --version

      - name: Acquire the official layer
        run: python scripts/fetch_image.py

      - name: Extract the repo definition
        run: python reconstruction/extract-repo-file.py

      - name: Build
        run: |
          podman build \
            --squash-all \
            --build-arg BUILDER=registry.access.redhat.com/ubi9/ubi:${{ matrix.releasever }} \
            --file ${{ matrix.containerfile }} \
            --tag ${{ matrix.variant }}:${{ matrix.releasever }} \
            ${{ matrix.context }}

      - name: Verify — single layer
        run: |
          layers=$(podman image inspect ${{ matrix.variant }}:${{ matrix.releasever }} --format '{{len .RootFS.Layers}}')
          echo "layers: $layers"
          test "$layers" = "1" || { echo "FAIL: expected 1 layer, got $layers"; exit 1; }

      - name: Verify — no package manager
        run: |
          podman run --rm ${{ matrix.variant }}:${{ matrix.releasever }} /bin/sh -c '
            fail=0
            for b in rpm dnf microdnf yum; do
              if command -v "$b" >/dev/null 2>&1; then echo "FAIL: $b present"; fail=1; fi
            done
            exit $fail'

      - name: Verify — no setuid, setgid or file capabilities
        run: |
          podman run --rm ${{ matrix.variant }}:${{ matrix.releasever }} /bin/sh -c '
            found=$(find / -xdev \( -perm -4000 -o -perm -2000 \) -print 2>/dev/null)
            if [ -n "$found" ]; then echo "FAIL: setuid/setgid present:"; echo "$found"; exit 1; fi
            echo "clean"'

      - name: Report size against the official image
        run: |
          size=$(podman image inspect ${{ matrix.variant }}:${{ matrix.releasever }} --format '{{.Size}}')
          official=23591424
          echo "## ${{ matrix.variant }} @ RHEL ${{ matrix.releasever }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Measure | Bytes |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | ---: |" >> "$GITHUB_STEP_SUMMARY"
          echo "| This build (uncompressed) | $size |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Official ubi9-micro | $official |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Difference | $((size - official)) |" >> "$GITHUB_STEP_SUMMARY"
          echo "size=$size official=$official delta=$((size - official))"

      - name: Export the layer for comparison
        run: |
          mkdir -p out
          podman save --format oci-archive \
            -o out/${{ matrix.variant }}-${{ matrix.releasever }}.tar \
            ${{ matrix.variant }}:${{ matrix.releasever }}

      - name: Upload the built image
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.variant }}-${{ matrix.releasever }}
          path: out/*.tar
          retention-days: 7
